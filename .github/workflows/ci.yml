# CONTINUOUS INTEGRATION — SPECIFICATION §14.
#
# "Continuous integration runs the known-answer test suite on every change, blocking merges
# that fail."
#
# This file is the "runs on every change" half. THE "BLOCKING" HALF IS NOT IN THIS FILE and
# cannot be: GitHub decides what blocks a merge in the repository's branch-protection settings,
# which live in the GitHub web interface and not in the tree. Until the rule named `suite` is
# marked required there, a failing run shows a red cross and merges anyway. DEPLOY.md step 3
# is that setting.
#
# WHY ONE NODE VERSION AND NOT A MATRIX. This project ships a static site to one CDN. There is
# no supported-runtime surface to test against, so a matrix would only buy longer runs. The
# version is read from `.node-version`, which is the same file Cloudflare Pages reads — so the
# runtime that proves the build green and the runtime that performs the deploy cannot drift
# apart. That matters here more than usual: `npm run build` executes a TypeScript file directly
# (`scripts/site/build-coverage.ts`), which older Node cannot do at all.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. Nothing here has side effects, so the
# older answer is never the one anybody wants.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # THE EXCLUSION LIST LIVES HERE AND NOWHERE ELSE, so the step that checks it and the step
    # that applies it cannot disagree. See the long note further down for what it is and why.
    env:
      EXCLUDED: >-
        scripts/extract/defensive-counts.test.ts
        scripts/extract/per-tick-read.test.ts
        scripts/extract/rank-varying-count.test.ts
        scripts/extract/rune-propose.test.ts
        scripts/fetch/ability-index.test.ts
        scripts/fetch/defender-toggles.test.ts
        scripts/fetch/rank-shape.test.ts
        tests/ability-files.test.ts
        tests/cross-area-seams.test.ts

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # `npm ci` and not `npm install`: it installs exactly what package-lock.json pins and
      # fails if the lock file and package.json disagree, so a dependency cannot change under
      # the suite without somebody noticing.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ═══════════════════════════════════════════════════════════════════════════════════════
      # SPECIFICATION §14 SAYS CI "RUNS THE KNOWN-ANSWER TEST SUITE". THAT IS PARTLY FALSE HERE,
      # AND THIS IS THE RECORD OF BY HOW MUCH.
      #
      # CI runs 2,877 of the project's 3,127 tests. THE OTHER 250 RUN ON THE PROJECT OWNER'S
      # MACHINE ONLY, and nowhere else, including here.
      #
      # WHY. Nine test files read the harvester's output from `build/proposed-curated/` — about
      # 4.3 MB across six files, the largest being `ability-wikitext.json` at 3.1 MB. That
      # directory is in `.gitignore` on purpose ("Draft curated entries produced by
      # scripts/extract. Proposals only"), so it is not in the repository and is absent from
      # every fresh clone. The files cannot be regenerated here either: they come from harvesting
      # the wiki over the network, which PLAN.md §2 measures at ~20 minutes.
      #
      # HOW IT WAS FOUND, TWICE, AND THE SECOND TIME IS THE INSTRUCTIVE ONE. The first CI run
      # ever, on 2026-08-16, failed on seven files with ENOENT: the suite had been green on one
      # machine since it was written, because the files were sitting on it, and nothing had ever
      # run it anywhere else. The list of seven was built by grepping test files for the artifact
      # path — and the NEXT run failed on two more, `defensive-counts.test.ts` and
      # `per-tick-read.test.ts`, which reach the same file through a helper
      # (`scripts/extract/per-tick-read.ts`) and so never mention it themselves.
      #
      # SO THE GUARD BELOW NO LONGER USES A PATTERN. A pattern over source text cannot see a
      # transitive import, and a guard that looks precise while missing two files is worse than
      # one that admits what it does. It now checks the list BY OBSERVATION: it runs each excluded
      # file and requires it to fail for the missing artifact. Both directions of drift are then
      # caught by something that ran rather than something that matched:
      #
      #   • A file that needs excluding and is not on the list — the main test step fails with
      #     ENOENT and names it. That is how the two above were found.
      #   • A file on the list that no longer needs to be — the guard finds it PASSING without the
      #     artifact and fails, so the list cannot outlive its reason.
      #
      # WHAT IS ACTUALLY UNCHECKED. These are the tests over the ability harvester and the fetch
      # pipeline — PLAN.md §3 calls Area C "the area where a defect costs the most", and
      # `tests/cross-area-seams.test.ts` is among them, so the sweep that exists to catch two
      # areas holding opposite rules is itself one of the checks CI does not run. Treat a green
      # run here as evidence about THE ENGINE, THE INTERFACE, THE URL ENCODER AND THE SITE, and
      # not as evidence about the harvester.
      #
      # THE FIX IS KNOWN AND IS NOT THIS. PLAN.md §7 carries it: make these files report a missing
      # artifact as a NAMED SKIP rather than an ENOENT stack, so what is not covered is counted by
      # the runner instead of listed in a YAML file. Plan-mode work across three partitioned
      # areas. This list is the honest interim, not the answer.
      # ═══════════════════════════════════════════════════════════════════════════════════════
      - name: Every excluded file is still excluded for the right reason
        # NOTE: this step is meaningful only where the artifact is ABSENT, which is every machine
        # except the project owner's. Run locally it reports all nine as no longer needing
        # exclusion, correctly — they pass there.
        run: |
          set -uo pipefail
          wrong=0
          for f in $EXCLUDED; do
            if out=$(npx vitest run "$f" 2>&1); then
              echo "NO LONGER NEEDS EXCLUDING: $f passed without build/proposed-curated/."
              echo "  Remove it from EXCLUDED below and from PLAN.md §7, and the count rises."
              wrong=1
            elif ! echo "$out" | grep -q 'proposed-curated'; then
              echo "EXCLUDED FOR THE WRONG REASON: $f failed, but not for the missing artifact."
              echo "  This is a real failure hiding behind an exclusion. Last 20 lines:"
              echo "$out" | tail -20
              wrong=1
            else
              echo "ok (absent artifact): $f"
            fi
          done
          if [ "$wrong" -ne 0 ]; then exit 1; fi
          echo "All nine excluded files fail only for the missing artifact. List is honest."

      # Vitest exits non-zero on a single failing test, which is what fails the job and, once
      # branch protection is on, what blocks the merge.
      - name: Known-answer test suite (2,877 of 3,127 — see the exclusion note above)
        run: |
          set -euo pipefail
          args=""
          for f in $EXCLUDED; do args="$args --exclude $f"; done
          npx vitest run $args

      # Building in CI is not redundant with the typecheck. `npm run build` also regenerates the
      # landing page's coverage figures and runs Rollup over eight entry points; either can fail
      # while `tsc --noEmit` passes.
      - name: Production build
        run: npm run build

      # THE CHECK THAT CATCHES THE FAILURE THIS PROJECT IS MOST EXPOSED TO. A multi-page build
      # is a set of files at paths; a page that exists in the dev server and not in `dist/` is a
      # 404 that only appears in production. `tests/site-structure.test.ts` proves the SOURCE
      # files agree with the page list — this proves the BUILT files do.
      - name: Every page is really in the build output
        run: |
          set -euo pipefail
          missing=0
          for page in index.html calculator/index.html checks/index.html changelog/index.html \
                      report/index.html about/index.html privacy/index.html cookies/index.html; do
            if [ ! -f "dist/$page" ]; then
              echo "MISSING from dist/: $page"
              missing=1
            fi
          done
          # The 404 page and the CDN's header rules are copied verbatim from public/ rather than
          # compiled, so nothing else would notice if they stopped being copied.
          for asset in 404.html _headers robots.txt sitemap.xml favicon.svg; do
            if [ ! -f "dist/$asset" ]; then
              echo "MISSING from dist/: $asset"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "The build did not produce every file the site serves."
            exit 1
          fi
          echo "All eight pages and all five static files are present in dist/."
