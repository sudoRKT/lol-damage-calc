# CONTINUOUS INTEGRATION — SPECIFICATION §14.
#
# "Continuous integration runs the known-answer test suite on every change, blocking merges
# that fail."
#
# This file is the "runs on every change" half. THE "BLOCKING" HALF IS NOT IN THIS FILE and
# cannot be: GitHub decides what blocks a merge in the repository's branch-protection settings,
# which live in the GitHub web interface and not in the tree. Until the rule named `suite` is
# marked required there, a failing run shows a red cross and merges anyway. DEPLOY.md step 3
# is that setting.
#
# WHY ONE NODE VERSION AND NOT A MATRIX. This project ships a static site to one CDN. There is
# no supported-runtime surface to test against, so a matrix would only buy longer runs. The
# version is read from `.node-version`, which is the same file Cloudflare Pages reads — so the
# runtime that proves the build green and the runtime that performs the deploy cannot drift
# apart. That matters here more than usual: `npm run build` executes a TypeScript file directly
# (`scripts/site/build-coverage.ts`), which older Node cannot do at all.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. Nothing here has side effects, so the
# older answer is never the one anybody wants.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # `npm ci` and not `npm install`: it installs exactly what package-lock.json pins and
      # fails if the lock file and package.json disagree, so a dependency cannot change under
      # the suite without somebody noticing.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ═══════════════════════════════════════════════════════════════════════════════════════
      # SPECIFICATION §14 SAYS CI "RUNS THE KNOWN-ANSWER TEST SUITE". THAT IS PARTLY FALSE HERE,
      # AND THIS IS THE RECORD OF BY HOW MUCH.
      #
      # CI runs 2,944 of the project's 3,127 tests. THE OTHER 183 RUN ON THE PROJECT OWNER'S
      # MACHINE ONLY, and nowhere else, including here.
      #
      # WHY. Seven test files read the harvester's output from `build/proposed-curated/` — about
      # 4.3 MB across six files, the largest being `ability-wikitext.json` at 3.1 MB. That
      # directory is in `.gitignore` on purpose ("Draft curated entries produced by
      # scripts/extract. Proposals only"), so it is not in the repository and is absent from
      # every fresh clone. The files cannot be regenerated here either: they come from harvesting
      # the wiki over the network, which PLAN.md §2 measures at ~20 minutes.
      #
      # HOW IT WAS FOUND: the first CI run on 2026-08-16 failed on all seven with ENOENT. The
      # suite had been green on one machine since it was written because the files were sitting
      # there. Nothing had ever run it anywhere else, so nothing had said so.
      #
      # WHAT IS ACTUALLY UNCHECKED. These are the tests over the ability harvester and the fetch
      # pipeline — PLAN.md §3 calls Area C "the area where a defect costs the most". They are not
      # unrun; they are run by one person on one machine, and a second party has no way to
      # reproduce them. Treat a green run here as evidence about the ENGINE, THE INTERFACE AND
      # THE SITE, and not as evidence about the harvester.
      #
      # THE FIX IS KNOWN AND IS NOT THIS. PLAN.md §7 carries it: make the seven files report a
      # missing artifact as a named skip rather than an ENOENT stack, so what is not covered is
      # counted rather than excluded by a list. That is plan-mode work touching three partitioned
      # areas. This list is the honest interim, not the answer.
      #
      # THE LIST BELOW IS CHECKED AGAINST REALITY BY THE STEP THAT FOLLOWS, so it cannot quietly
      # grow. Adding an eighth file that reads `build/` fails CI and names it.
      # ═══════════════════════════════════════════════════════════════════════════════════════
      - name: The exclusion list is still exactly the files that need the missing artifacts
        run: |
          set -euo pipefail
          expected="scripts/extract/rank-varying-count.test.ts
          scripts/extract/rune-propose.test.ts
          scripts/fetch/ability-index.test.ts
          scripts/fetch/defender-toggles.test.ts
          scripts/fetch/rank-shape.test.ts
          tests/ability-files.test.ts
          tests/cross-area-seams.test.ts"
          expected=$(echo "$expected" | sed 's/^ *//' | sort)
          actual=$(grep -rl 'proposed-curated' --include='*.test.ts' --include='*.test.tsx' . \
                     --exclude-dir=node_modules | sed 's|^\./||' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "The list of test files that read build/proposed-curated/ has CHANGED."
            echo
            echo "Excluded by this workflow:"; echo "$expected"
            echo
            echo "Actually reading that directory:"; echo "$actual"
            echo
            echo "A file ADDED to the second list is a file CI would silently stop covering."
            echo "A file REMOVED from it is one CI could start covering again."
            echo "Either way this workflow and PLAN.md §7 need updating in the same commit."
            exit 1
          fi
          echo "Unchanged: 7 files, excluded deliberately and counted."

      # Vitest exits non-zero on a single failing test, which is what fails the job and, once
      # branch protection is on, what blocks the merge.
      #
      # Known limit of the guard above: it finds test files that MENTION the artifact path. A
      # test reaching it through a helper that does not would not be listed — and would fail
      # here with ENOENT, loudly, rather than pass while covering nothing. That is the right way
      # round for this to break.
      - name: Known-answer test suite (2,944 of 3,127 — see the exclusion note above)
        run: |
          npx vitest run \
            --exclude "scripts/extract/rank-varying-count.test.ts" \
            --exclude "scripts/extract/rune-propose.test.ts" \
            --exclude "scripts/fetch/ability-index.test.ts" \
            --exclude "scripts/fetch/defender-toggles.test.ts" \
            --exclude "scripts/fetch/rank-shape.test.ts" \
            --exclude "tests/ability-files.test.ts" \
            --exclude "tests/cross-area-seams.test.ts"

      # Building in CI is not redundant with the typecheck. `npm run build` also regenerates the
      # landing page's coverage figures and runs Rollup over eight entry points; either can fail
      # while `tsc --noEmit` passes.
      - name: Production build
        run: npm run build

      # THE CHECK THAT CATCHES THE FAILURE THIS PROJECT IS MOST EXPOSED TO. A multi-page build
      # is a set of files at paths; a page that exists in the dev server and not in `dist/` is a
      # 404 that only appears in production. `tests/site-structure.test.ts` proves the SOURCE
      # files agree with the page list — this proves the BUILT files do.
      - name: Every page is really in the build output
        run: |
          set -euo pipefail
          missing=0
          for page in index.html calculator/index.html checks/index.html changelog/index.html \
                      report/index.html about/index.html privacy/index.html cookies/index.html; do
            if [ ! -f "dist/$page" ]; then
              echo "MISSING from dist/: $page"
              missing=1
            fi
          done
          # The 404 page and the CDN's header rules are copied verbatim from public/ rather than
          # compiled, so nothing else would notice if they stopped being copied.
          for asset in 404.html _headers robots.txt sitemap.xml favicon.svg; do
            if [ ! -f "dist/$asset" ]; then
              echo "MISSING from dist/: $asset"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "The build did not produce every file the site serves."
            exit 1
          fi
          echo "All eight pages and all five static files are present in dist/."
